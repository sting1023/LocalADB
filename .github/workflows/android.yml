name: Test Build

on:
  push:
    branches: [v2.0]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: List files
        run: |
          echo "=== Root ==="
          ls -la
          echo ""
          echo "=== app/ ==="
          ls -la app/
          echo ""
          echo "=== app/src/main/ ==="
          ls -la app/src/main/
          echo ""
          echo "=== app/src/main/java/ ==="
          ls -la app/src/main/java/
          echo ""
          echo "=== Kotlin files ==="
          find app/src/main -name "*.kt" -type f
